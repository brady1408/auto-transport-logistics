{{define "order_list.html"}}
{{template "base" .}}
{{define "title"}}Orders - ATLinks{{end}}
{{define "content"}}
<div class="page-header">
    <h1>Orders</h1>
    <a href="/dispatch/orders/new" class="btn btn-primary">New Order</a>
</div>

<div class="filter-bar">
    <div class="form-group">
        <label for="search">Search</label>
        <input type="text" id="search" name="search" class="form-control search-input"
               placeholder="Order #, customer name..."
               value="{{.Filter.Search}}"
               hx-get="/dispatch/orders"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#order-table"
               hx-include=".filter-bar [name]"
               hx-push-url="true">
    </div>
    <div class="form-group">
        <label for="active">Status</label>
        <select id="active" name="active" class="form-control"
                hx-get="/dispatch/orders"
                hx-trigger="change"
                hx-target="#order-table"
                hx-include=".filter-bar [name]"
                hx-push-url="true">
            <option value="" {{selected .Filter.Active ""}}>All</option>
            <option value="active" {{selected .Filter.Active "active"}}>Active</option>
            <option value="inactive" {{selected .Filter.Active "inactive"}}>Inactive</option>
        </select>
    </div>
    <div class="form-group">
        <label for="date_from">From</label>
        <input type="date" id="date_from" name="date_from" class="form-control"
               value="{{.Filter.DateFrom}}"
               hx-get="/dispatch/orders"
               hx-trigger="change"
               hx-target="#order-table"
               hx-include=".filter-bar [name]"
               hx-push-url="true">
    </div>
    <div class="form-group">
        <label for="date_to">To</label>
        <input type="date" id="date_to" name="date_to" class="form-control"
               value="{{.Filter.DateTo}}"
               hx-get="/dispatch/orders"
               hx-trigger="change"
               hx-target="#order-table"
               hx-include=".filter-bar [name]"
               hx-push-url="true">
    </div>
</div>

<div id="order-table">
    {{template "order_table" .}}
</div>
{{end}}
{{end}}
