{{define "damage_claim_list.html"}}
{{template "base" .}}
{{define "title"}}Damage Claims - ATLinks{{end}}
{{define "content"}}
<div class="page-header">
    <h1>Damage Claims</h1>
    <a href="/accounting/damage-claims/new" class="btn btn-primary">New Claim</a>
</div>

<div class="filter-bar">
    <div class="form-group">
        <label for="search">Search</label>
        <input type="text" id="search" name="search" class="form-control search-input"
               placeholder="Claim #, VIN..."
               value="{{.Filter.Search}}"
               hx-get="/accounting/damage-claims"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#damage-claim-table"
               hx-include=".filter-bar [name]"
               hx-push-url="true">
    </div>
    <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="status" class="form-control"
                hx-get="/accounting/damage-claims"
                hx-trigger="change"
                hx-target="#damage-claim-table"
                hx-include=".filter-bar [name]"
                hx-push-url="true">
            <option value="" {{selected .Filter.Status ""}}>All</option>
            <option value="Open" {{selected .Filter.Status "Open"}}>Open</option>
            <option value="Approved" {{selected .Filter.Status "Approved"}}>Approved</option>
            <option value="Denied" {{selected .Filter.Status "Denied"}}>Denied</option>
            <option value="Paid" {{selected .Filter.Status "Paid"}}>Paid</option>
        </select>
    </div>
</div>

<div id="damage-claim-table">
    {{template "damage_claim_table" .}}
</div>
{{end}}
{{end}}
