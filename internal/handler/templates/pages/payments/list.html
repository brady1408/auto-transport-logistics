{{define "payment_list.html"}}
{{template "base" .}}
{{define "title"}}Payments - ATLinks{{end}}
{{define "content"}}
<div class="page-header">
    <h1>Payments</h1>
    <a href="/accounting/payments/new" class="btn btn-primary">New Payment</a>
</div>

<div class="filter-bar">
    <div class="form-group">
        <label for="search">Search</label>
        <input type="text" id="search" name="search" class="form-control search-input"
               placeholder="Customer, check #..."
               value="{{.Filter.Search}}"
               hx-get="/accounting/payments"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#payment-table"
               hx-include=".filter-bar [name]"
               hx-push-url="true">
    </div>
    <div class="form-group">
        <label for="date_from">From</label>
        <input type="date" id="date_from" name="date_from" class="form-control"
               value="{{.Filter.DateFrom}}"
               hx-get="/accounting/payments"
               hx-trigger="change"
               hx-target="#payment-table"
               hx-include=".filter-bar [name]"
               hx-push-url="true">
    </div>
    <div class="form-group">
        <label for="date_to">To</label>
        <input type="date" id="date_to" name="date_to" class="form-control"
               value="{{.Filter.DateTo}}"
               hx-get="/accounting/payments"
               hx-trigger="change"
               hx-target="#payment-table"
               hx-include=".filter-bar [name]"
               hx-push-url="true">
    </div>
</div>

<div id="payment-table">
    {{template "payment_table" .}}
</div>
{{end}}
{{end}}
