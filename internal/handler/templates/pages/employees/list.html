{{define "employee_list.html"}}
{{template "base" .}}
{{define "title"}}Employees - ATLinks{{end}}
{{define "content"}}
<div class="page-header">
    <h1>Employees</h1>
    <a href="/global/employees/new" class="btn btn-primary">New Employee</a>
</div>

<div class="filter-bar">
    <div class="form-group">
        <label for="search">Search</label>
        <input type="text" id="search" name="search" class="form-control search-input"
               placeholder="Name or ID..."
               value="{{.Filter.Search}}"
               hx-get="/global/employees" hx-trigger="keyup changed delay:300ms"
               hx-target="#employee-table" hx-include=".filter-bar [name]" hx-push-url="true">
    </div>
    <div class="form-group">
        <label for="active">Status</label>
        <select id="active" name="active" class="form-control"
                hx-get="/global/employees" hx-trigger="change"
                hx-target="#employee-table" hx-include=".filter-bar [name]" hx-push-url="true">
            <option value="">All</option>
            <option value="active" {{selected .Filter.Active "active"}}>Active</option>
            <option value="inactive" {{selected .Filter.Active "inactive"}}>Inactive</option>
        </select>
    </div>
    <div class="form-group">
        <label for="is_driver">Driver</label>
        <select id="is_driver" name="is_driver" class="form-control"
                hx-get="/global/employees" hx-trigger="change"
                hx-target="#employee-table" hx-include=".filter-bar [name]" hx-push-url="true">
            <option value="">All</option>
            <option value="yes" {{selected .Filter.IsDriver "yes"}}>Drivers</option>
            <option value="no" {{selected .Filter.IsDriver "no"}}>Non-Drivers</option>
        </select>
    </div>
</div>

<div id="employee-table">
    {{template "employee_table" .}}
</div>
{{end}}
{{end}}
