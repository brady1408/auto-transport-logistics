{{define "credit_memo_list.html"}}
{{template "base" .}}
{{define "title"}}Credit Memos - ATLinks{{end}}
{{define "content"}}
<div class="page-header">
    <h1>Credit Memos</h1>
    <a href="/accounting/credit-memos/new" class="btn btn-primary">New Credit Memo</a>
</div>

<div class="filter-bar">
    <div class="form-group">
        <label for="search">Search</label>
        <input type="text" id="search" name="search" class="form-control search-input"
               placeholder="Credit #, customer, invoice..."
               value="{{.Filter.Search}}"
               hx-get="/accounting/credit-memos"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#credit-memo-table"
               hx-include=".filter-bar [name]"
               hx-push-url="true">
    </div>
    <div class="form-group">
        <label for="status">Status</label>
        <select id="status" name="status" class="form-control"
                hx-get="/accounting/credit-memos"
                hx-trigger="change"
                hx-target="#credit-memo-table"
                hx-include=".filter-bar [name]"
                hx-push-url="true">
            <option value="" {{selected .Filter.Status ""}}>All</option>
            <option value="Pending" {{selected .Filter.Status "Pending"}}>Pending</option>
            <option value="Applied" {{selected .Filter.Status "Applied"}}>Applied</option>
            <option value="Void" {{selected .Filter.Status "Void"}}>Void</option>
        </select>
    </div>
</div>

<div id="credit-memo-table">
    {{template "credit_memo_table" .}}
</div>
{{end}}
{{end}}
