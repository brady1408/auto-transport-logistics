{{define "truck_list.html"}}
{{template "base" .}}
{{define "title"}}Trucks - ATLinks{{end}}
{{define "content"}}
<div class="page-header">
    <h1>Trucks</h1>
    <a href="/global/trucks/new" class="btn btn-primary">New Truck</a>
</div>

<div class="filter-bar">
    <div class="form-group">
        <label for="search">Search</label>
        <input type="text" id="search" name="search" class="form-control search-input"
               placeholder="Truck # or driver..."
               value="{{.Filter.Search}}"
               hx-get="/global/trucks" hx-trigger="keyup changed delay:300ms"
               hx-target="#truck-table" hx-include=".filter-bar [name]" hx-push-url="true">
    </div>
    <div class="form-group">
        <label for="active">Status</label>
        <select id="active" name="active" class="form-control"
                hx-get="/global/trucks" hx-trigger="change"
                hx-target="#truck-table" hx-include=".filter-bar [name]" hx-push-url="true">
            <option value="">All</option>
            <option value="active" {{selected .Filter.Active "active"}}>Active</option>
            <option value="inactive" {{selected .Filter.Active "inactive"}}>Inactive</option>
        </select>
    </div>
    <div class="form-group">
        <label for="leased_truck">Ownership</label>
        <select id="leased_truck" name="leased_truck" class="form-control"
                hx-get="/global/trucks" hx-trigger="change"
                hx-target="#truck-table" hx-include=".filter-bar [name]" hx-push-url="true">
            <option value="">All</option>
            <option value="yes" {{selected .Filter.LeasedTruck "yes"}}>Leased</option>
            <option value="no" {{selected .Filter.LeasedTruck "no"}}>Owned</option>
        </select>
    </div>
</div>

<div id="truck-table">
    {{template "truck_table" .}}
</div>
{{end}}
{{end}}
