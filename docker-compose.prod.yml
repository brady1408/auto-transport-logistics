services:
  atlinks:
    image: 192.168.23.44:5050/atlinks:latest
    container_name: atlinks
    restart: unless-stopped
    env_file: .env.prod
    environment:
      PORT: "8080"
      UPLOAD_DIR: "/data/uploads"
      MIGRATIONS_DIR: "/migrations"
    volumes:
      - /volume1/docker/atlinks/uploads:/data/uploads
      - migrations:/migrations
    networks:
      - tunnel
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: atlinks-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - migrations:/migrations
    networks:
      - tunnel

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: atlinks-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:
      - tunnel
    depends_on:
      - atlinks

  cloudflared-atlascloud:
    image: cloudflare/cloudflared:latest
    container_name: atlascloud-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN_ATLASCLOUD}
    networks:
      - tunnel
    depends_on:
      - atlinks

networks:
  tunnel:
    driver: bridge

volumes:
  migrations:
