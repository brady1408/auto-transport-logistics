services:
  atlinks:
    image: 192.168.23.44:5050/atlinks:latest
    container_name: atlinks
    restart: unless-stopped
    env_file: .env.prod
    environment:
      PORT: "8080"
      UPLOAD_DIR: "/data/uploads"
    volumes:
      - /volume1/docker/atlinks/uploads:/data/uploads
    networks:
      - tunnel
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: atlinks-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:
      - tunnel
    depends_on:
      - atlinks

networks:
  tunnel:
    driver: bridge
