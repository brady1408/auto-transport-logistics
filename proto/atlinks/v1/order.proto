  optional string drop_customer_name = 26;
  optional string drop_contact = 27;
  optional string drop_phone = 28;
  optional string drop_address = 29;
  optional string drop_address2 = 30;
  optional string drop_city = 31;
  optional string drop_state = 32;
  optional string drop_zip = 33;
  optional string reference_number = 34;
  optional string po_number = 35;
  optional string sales_rep1 = 36;
  optional string sales_rep2 = 37;
  optional string comments = 38;
  optional string pu_instructions = 39;
  optional string do_instructions = 40;
  optional string transport_amt = 41;
  optional string transport_calc_type = 42;
  optional string fuel_surcharge = 43;
  optional string fuel_calc_type = 44;
  optional string other_charge = 45;
