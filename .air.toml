root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "node_modules", "atlinks-migration", "Stargazer_Source", "scripts"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "html", "css", "js"]
  kill_delay = "1s"

[log]
  time = false

[misc]
  clean_on_exit = true
